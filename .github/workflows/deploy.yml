name: Deploy

# 레포 루트는 teo-vibe/, Rails 앱은 teovibe/ 하위. 워크플로는 루트에 있어야
# Actions가 인식하므로, 실행 스텝은 working-directory로 teovibe/에서 돈다.
# main push 시 Actions(amd64 러너)가 빌드→ghcr.io push→SSH로 Kamal 배포.
# VPS는 pull+실행만 → 2GB RAM 보호.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teovibe
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # .kamal/secrets가 config/master.key 파일에서 RAILS_MASTER_KEY를 읽으므로
      # 시크릿 값으로 그 파일을 생성. printf '%s'로 후행 개행 없이 정확히 32자.
      # (.dockerignore가 config/master.key를 제외 → 이미지엔 안 박힘)
      - name: Write Rails master key
        run: printf '%s' "$RAILS_MASTER_KEY" > config/master.key

      - name: Set up Ruby (kamal gem)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: teovibe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH for VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'EOF'
          Host 5.78.179.202
            User root
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Kamal deploy
        run: bin/kamal deploy
