# TeoVibe Kamal 배포 설정
service: teovibe

image: amateo8282/teovibe

# Hetzner VPS
servers:
  web:
    - 5.78.179.202
  # job:
  #   hosts:
  #     - 5.78.179.202
  #   cmd: bin/jobs

# 프록시 설정
proxy:
  ssl: true
  host: jaeho.im
  response_timeout: 120

# GitHub Container Registry (ghcr.io)
# CI(GitHub Actions)에서 GITHUB_TOKEN을 KAMAL_REGISTRY_PASSWORD로 주입.
registry:
  server: ghcr.io
  username: amateo8282
  password:
    - KAMAL_REGISTRY_PASSWORD

# 환경변수
env:
  secret:
    - RAILS_MASTER_KEY
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - KAKAO_CLIENT_ID
    - KAKAO_CLIENT_SECRET
    - ANTHROPIC_API_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true
    WEB_CONCURRENCY: 2
    RAILS_LOG_LEVEL: info

# 별칭
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# SQLite 영구 스토리지
volumes:
  - "teovibe_storage:/rails/storage"

# 에셋 브릿지
asset_path: /rails/public/vite

# 빌드 설정 — GitHub Actions(amd64 러너)에서 네이티브 빌드 → ghcr.io push.
# 서버는 pull+실행만 → 빌드 때 2GB RAM/CPU 안 잡아먹음.
# remote 빌드 안 함(서버에서 빌드 금지). 로컬 맥에서 수동 deploy 시엔
# arch:amd64라 QEMU 에뮬레이션으로 빌드된다(느리지만 서버 부담 0).
builder:
  arch: amd64

# SSH 설정 — config: true면 net-ssh가 ~/.ssh/config를 읽는다.
# CI에선 그 파일에 StrictHostKeyChecking no를 넣어 호스트키 불일치를 우회
# (ephemeral 러너 → 고정 VPS 연결이라 허용 가능). 로컬엔 영향 없음.
ssh:
  user: root
  config: true
